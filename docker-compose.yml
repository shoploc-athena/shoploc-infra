# Settings shared by every Java service (YAML anchor, reused with "<<: *java-service")
x-java-service: &java-service
  platform: linux/amd64
  restart: unless-stopped
  mem_limit: 512m   # target: 512 MB or less per Java service
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 40s

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Used by db/init-db.sh to create one database user per service instance
      USER_LILLE_DB_PASSWORD: ${USER_LILLE_DB_PASSWORD}
      STORE_LILLE_DB_PASSWORD: ${STORE_LILLE_DB_PASSWORD}
      ORDER_LILLE_DB_PASSWORD: ${ORDER_LILLE_DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data   # data survives container removal
      - ./db/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  store-service-lille:
    <<: *java-service
    image: ghcr.io/shoploc-athena/store-service:develop
    environment:
      DB_URL: jdbc:postgresql://db:5432/store_lille
      DB_USER: store_lille
      DB_PASSWORD: ${STORE_LILLE_DB_PASSWORD}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    ports:
      - "8080:8080"
    networks:
      default:
        aliases:
          - store-service   # temporary: the current gateway still calls "store-service"
    depends_on:
      db:
        condition: service_healthy

  user-service-lille:
    <<: *java-service
    image: ghcr.io/shoploc-athena/user-service:develop
    environment:
      DB_URL: jdbc:postgresql://db:5432/user_lille
      DB_USER: user_lille
      DB_PASSWORD: ${USER_LILLE_DB_PASSWORD}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

  order-service-lille:
    <<: *java-service
    image: ghcr.io/shoploc-athena/order-service:develop
    environment:
      DB_URL: jdbc:postgresql://db:5432/order_lille
      DB_USER: order_lille
      DB_PASSWORD: ${ORDER_LILLE_DB_PASSWORD}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    ports:
      - "8082:8080"
    depends_on:
      db:
        condition: service_healthy

  notification-analytics-service:
    <<: *java-service
    image: ghcr.io/shoploc-athena/notification-analytics-service:develop
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    ports:
      - "8083:8080"

  frontend:
    image: ghcr.io/shoploc-athena/shoploc-frontend:develop
    platform: linux/amd64
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      # the gateway needs every upstream service to be reachable when it starts
      store-service-lille:
        condition: service_healthy
      user-service-lille:
        condition: service_healthy
      order-service-lille:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
