services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data   # data survives container removal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  store-service:
    image: ghcr.io/shoploc-athena/store-service:develop
    platform: linux/amd64
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy   # wait until the database is ready
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  user-service:
    image: ghcr.io/shoploc-athena/user-service:develop
    platform: linux/amd64
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  order-service:
    image: ghcr.io/shoploc-athena/order-service:develop
    platform: linux/amd64
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  notification-analytics-service:
    image: ghcr.io/shoploc-athena/notification-analytics-service:develop
    platform: linux/amd64
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  frontend:
    image: ghcr.io/shoploc-athena/shoploc-frontend:develop
    platform: linux/amd64
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      store-service:
        condition: service_healthy   # start the frontend once the catalogue is ready
    restart: unless-stopped

volumes:
  db-data: